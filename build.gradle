plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.1'
    id 'io.papermc.paperweight.userdev' version '1.7.2'
    id 'org.jetbrains.kotlin.jvm' version '2.0.20'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.0.20'
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

kotlin {
    jvmToolchain(targetJavaVersion)
}

group = 'com.github.anviks'
version = '1.0'

base {
    archivesName = 'vixplugin'
}

sourceSets {
    main {
        java {
            srcDirs 'src/main/java'
            exclude 'com/github/anviks/vixplugin/sandbox/**'
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'sonatype'
        url = 'https://oss.sonatype.org/content/groups/public/'
    }
    maven {
        name = 'minecraft-libraries'
        url = 'https://libraries.minecraft.net'
    }
    maven {
        url = 'https://repo.codemc.org/repository/maven-public/'
    }
    maven {
        url 'https://repo.dmulloy2.net/repository/public/'
    }
}

dependencies {
    implementation 'com.mojang:brigadier:1.0.18'
    implementation 'commons-io:commons-io:2.11.0'
    implementation 'org.jetbrains:annotations:24.0.1'
    implementation 'me.lucko:commodore:2.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.1'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.14.2'
    implementation 'com.jeff-media:custom-block-data:2.2.2'
    implementation 'com.jeff-media:MorePersistentDataTypes:2.4.0'
    compileOnly 'dev.jorel:commandapi-bukkit-core:9.5.0'
    paperweight.paperDevBundle '1.21.1-R0.1-SNAPSHOT'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8'
    implementation 'org.jetbrains.kotlin:kotlin-reflect:1.6.20'
    implementation 'org.reflections:reflections:0.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json-okio-jvm:1.7.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

shadowJar {
    archiveClassifier.set('')
    archiveVersion.set('1.0')
    relocate 'com.jeff_media.customblockdata', 'com.github.anviks.customblockdata'
    relocate 'com.jeff_media.morepersistentdatatypes', 'com.github.anviks.morepersistentdatatypes'
    destinationDirectory.set(file('C:/Users/Andreas Viks/Desktop/MC Servers/Paper 1.21.1/plugins'))
}

build.dependsOn(shadowJar)
